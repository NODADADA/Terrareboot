<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계관 소개 — [게임 이름]</title>
<meta name="description" content="[게임 이름]의 세계관을 소개합니다.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">

<style>
  :root{
    --bg: #F1EEE4;
    --bg-alt: #E7E2D2;
    --ink: #1E1C18;
    --ink-soft: #5B564C;
    --accent: #2F5233;
    --accent-soft: #7C9473;
    --gold: #A9773A;
    --line: #D3CBB4;
    --font-display: 'Gowun Batang', serif;
    --font-body: 'PretendardVariable', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    --max-w: 760px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
  }
  a{ color: var(--accent); }
  .wrap{ max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

  .tabs{ border-bottom: 1px solid var(--line); background: var(--bg-alt); }
  .tabs .wrap{ display:flex; gap: 4px; padding-top: 12px; padding-bottom: 0; }
  .tabs a{
    display:inline-block;
    padding: 12px 22px;
    font-size: 14.5px;
    text-decoration: none;
    color: var(--ink-soft);
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .tabs a:hover{ color: var(--ink); background: var(--bg); }
  .tabs a.active{
    color: var(--ink); background: var(--bg);
    border-color: var(--line); font-weight: 700;
  }

  .hero{ padding: 72px 0 48px; border-bottom: 1px solid var(--line); }
  h1.title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin: 0 0 10px;
  }
  .tagline{ color: var(--ink-soft); margin: 0; }

  section{ padding: 56px 0; }
  section + section{ border-top: 1px solid var(--line); }
  .eyebrow-line{ display:flex; align-items:center; gap: 14px; margin-bottom: 24px; }
  .eyebrow-line .num{ font-family: var(--font-display); color: var(--gold); font-size: 15px; }
  .eyebrow-line h2{ font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0; }
  .eyebrow-line::after{ content:""; flex:1; height:1px; background: var(--line); }

  .pull{
    font-family: var(--font-display);
    font-size: clamp(1.15rem, 2.4vw, 1.5rem);
    line-height: 1.55;
    max-width: 62ch;
    border-left: 3px solid var(--accent);
    padding-left: 22px;
    margin: 0 0 24px;
  }
  p.body{ max-width: 68ch; color: var(--ink-soft); }

  footer{ padding: 40px 0 56px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>

<nav class="tabs" aria-label="주요 페이지">
  <div class="wrap">
    <a href="characters.html">캐릭터 소개</a>
    <a href="world.html" class="active">세계관 소개</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <h1 class="title">세계관 소개</h1>
    <p class="tagline">이 이야기가 펼쳐지는 무대.</p>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="eyebrow-line">
        <span class="num">01</span>
        <h2>배경</h2>
      </div>
      <p class="pull">[세계관의 핵심을 한두 문장으로 — 어떤 세계이고, 어떤 정서를 가진 곳인지]</p>
      <p class="body">[좀 더 자세한 배경 설명. 시대적 상황, 지리적 특징, 사회 구조, 주된 갈등 요소 등을 자유롭게 적어주세요.]</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="eyebrow-line">
        <span class="num">02</span>
        <h2>주요 지역</h2>
      </div>
      <p class="body">[이야기가 벌어지는 주요 장소들을 소개하는 공간입니다.]</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="eyebrow-line">
        <span class="num">03</span>
        <h2>규칙과 힘</h2>
      </div>
      <p class="body">[세계를 움직이는 규칙 — 마법 체계, 기술 수준, 특수한 자연현상 등을 설명합니다.]</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a href="index.html">← 메인으로 돌아가기</a>
  </div>
</footer>

</body>
</html>
