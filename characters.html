<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 소개 — [게임 이름]</title>
<meta name="description" content="[게임 이름]에 등장하는 캐릭터를 소개합니다.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">

<style>
  :root{
    --bg: #F1EEE4;
    --bg-alt: #E7E2D2;
    --ink: #1E1C18;
    --ink-soft: #5B564C;
    --accent: #2F5233;
    --accent-soft: #7C9473;
    --gold: #A9773A;
    --line: #D3CBB4;
    --font-display: 'Gowun Batang', serif;
    --font-body: 'PretendardVariable', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    --max-w: 760px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
  }
  a{ color: var(--accent); }
  .wrap{ max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

  .tabs{ border-bottom: 1px solid var(--line); background: var(--bg-alt); }
  .tabs .wrap{ display:flex; gap: 4px; padding-top: 12px; padding-bottom: 0; }
  .tabs a{
    display:inline-block;
    padding: 12px 22px;
    font-size: 14.5px;
    text-decoration: none;
    color: var(--ink-soft);
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .tabs a:hover{ color: var(--ink); background: var(--bg); }
  .tabs a.active{
    color: var(--ink); background: var(--bg);
    border-color: var(--line); font-weight: 700;
  }

  .hero{ padding: 72px 0 48px; border-bottom: 1px solid var(--line); }
  h1.title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin: 0 0 10px;
  }
  .tagline{ color: var(--ink-soft); margin: 0; }

  section{ padding: 56px 0; }
  .eyebrow-line{ display:flex; align-items:center; gap: 14px; margin-bottom: 24px; }
  .eyebrow-line .num{ font-family: var(--font-display); color: var(--gold); font-size: 15px; }
  .eyebrow-line h2{ font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0; }
  .eyebrow-line::after{ content:""; flex:1; height:1px; background: var(--line); }

  .char-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .char-card{
    border: 1px solid var(--line);
    background: var(--bg-alt);
    border-radius: 8px;
    padding: 20px;
  }
  .char-card h3{
    font-family: var(--font-display);
    font-size: 1.15rem;
    margin: 0 0 6px;
  }
  .char-card .role{
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .char-card p{ margin: 0; color: var(--ink-soft); font-size: 14.5px; }
  @media (max-width: 560px){
    .char-grid{ grid-template-columns: 1fr; }
  }

  footer{ padding: 40px 0 56px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>

<nav class="tabs" aria-label="주요 페이지">

</header>

<main>

      </div>

      <div class="char-grid">
        <div class="char-card">
          <h3>[캐릭터 이름]</h3>
          <div class="role">[역할 / 소속]</div>
          <p>[성격, 배경, 이야기에서의 위치를 간단히 소개]</p>
        </div>
        <div class="char-card">

          <p>[성격, 배경, 이야기에서의 위치를 간단히 소개]</p>
        </div>
        <div class="char-card">
          <h3>[캐릭터 이름]</h3>
          <div class="role">[역할 / 소속]</div>
          <p>[성격, 배경, 이야기에서의 위치를 간단히 소개]</p>
        </div>
        <div class="char-card">
          <h3>[캐릭터 이름]</h3>
          <div class="role">[역할 / 소속]</div>
          <p>[성격, 배경, 이야기에서의 위치를 간단히 소개]</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a href="index.html">← 메인으로 돌아가기</a>
  </div>
</footer>

</body>
</html>
